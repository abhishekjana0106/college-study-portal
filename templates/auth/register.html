{% extends 'base.html' %}

{% block title %}Create Account | Academix Portal{% endblock %}

{% block content %}
<div class="min-h-[85vh] flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-xl w-full space-y-8 bg-white p-8 sm:p-10 rounded-3xl border border-slate-200 shadow-xl">
        
        <div class="text-center">
            <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-blue-700 to-indigo-600 flex items-center justify-center text-white mx-auto shadow-md mb-4">
                <i class="fas fa-user-plus text-xl"></i>
            </div>
            <h2 class="text-2xl font-extrabold text-slate-900 tracking-tight">Create your student / faculty account</h2>
            <p class="text-xs text-slate-500 mt-2">Join the centralized academic portal to share and download study materials</p>
        </div>

        <form action="{{ url_for('auth.register') }}" method="POST" class="mt-8 space-y-4">
            
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <!-- Full Name -->
                <div>
                    <label for="full_name" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">
                        Full Name <span class="text-rose-500">*</span>
                    </label>
                    <input type="text" name="full_name" id="full_name" required placeholder="Aarav Patel"
                           class="w-full px-3.5 py-2.5 bg-slate-50 text-slate-800 text-sm rounded-xl border border-slate-200 focus:bg-white focus:border-blue-500 focus:outline-none">
                </div>

                <!-- Username -->
                <div>
                    <label for="username" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">
                        Username <span class="text-rose-500">*</span>
                    </label>
                    <input type="text" name="username" id="username" required placeholder="aarav21"
                           class="w-full px-3.5 py-2.5 bg-slate-50 text-slate-800 text-sm rounded-xl border border-slate-200 focus:bg-white focus:border-blue-500 focus:outline-none">
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <!-- Email -->
                <div>
                    <label for="email" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">
                        College Email <span class="text-rose-500">*</span>
                    </label>
                    <input type="email" name="email" id="email" required placeholder="aarav@college.edu"
                           class="w-full px-3.5 py-2.5 bg-slate-50 text-slate-800 text-sm rounded-xl border border-slate-200 focus:bg-white focus:border-blue-500 focus:outline-none">
                </div>

                <!-- Roll Number -->
                <div>
                    <label for="roll_number" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">
                        Roll / Reg Number
                    </label>
                    <input type="text" name="roll_number" id="roll_number" placeholder="21CS045"
                           class="w-full px-3.5 py-2.5 bg-slate-50 text-slate-800 text-sm rounded-xl border border-slate-200 focus:bg-white focus:border-blue-500 focus:outline-none">
                </div>
            </div>

            <!-- Role Selection -->
            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">
                    Account Type <span class="text-rose-500">*</span>
                </label>
                <div class="grid grid-cols-2 gap-3">
                    <label class="flex items-center p-3 rounded-xl border border-slate-200 cursor-pointer hover:bg-slate-50 transition-colors">
                        <input type="radio" name="role" value="student" checked class="text-blue-600 focus:ring-blue-500">
                        <span class="ml-2.5 text-xs font-bold text-slate-800">Student Account</span>
                    </label>
                    <label class="flex items-center p-3 rounded-xl border border-slate-200 cursor-pointer hover:bg-slate-50 transition-colors">
                        <input type="radio" name="role" value="faculty" class="text-blue-600 focus:ring-blue-500">
                        <span class="ml-2.5 text-xs font-bold text-slate-800">Faculty / Teacher</span>
                    </label>
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <!-- Department -->
                <div>
                    <label for="department_id" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">
                        Department
                    </label>
                    <select name="department_id" id="department_id"
                            class="w-full px-3.5 py-2.5 bg-slate-50 text-slate-700 text-xs rounded-xl border border-slate-200 focus:bg-white focus:border-blue-500 focus:outline-none">
                        <option value="">Select Department</option>
                        {% for d in departments %}
                            <option value="{{ d.id }}">{{ d.code }} - {{ d.name }}</option>
                        {% endfor %}
                    </select>
                </div>

                <!-- Semester -->
                <div>
                    <label for="semester" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">
                        Current Semester
                    </label>
                    <select name="semester" id="semester"
                            class="w-full px-3.5 py-2.5 bg-slate-50 text-slate-700 text-xs rounded-xl border border-slate-200 focus:bg-white focus:border-blue-500 focus:outline-none">
                        <option value="">Select Semester</option>
                        {% for s in range(1, 9) %}
                            <option value="{{ s }}">Semester {{ s }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <!-- Password -->
                <div>
                    <label for="password" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">
                        Password (Min 6 chars) <span class="text-rose-500">*</span>
                    </label>
                    <input type="password" name="password" id="password" required placeholder="••••••••"
                           class="w-full px-3.5 py-2.5 bg-slate-50 text-slate-800 text-sm rounded-xl border border-slate-200 focus:bg-white focus:border-blue-500 focus:outline-none">
                </div>

                <!-- Confirm Password -->
                <div>
                    <label for="confirm_password" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">
                        Confirm Password <span class="text-rose-500">*</span>
                    </label>
                    <input type="password" name="confirm_password" id="confirm_password" required placeholder="••••••••"
                           class="w-full px-3.5 py-2.5 bg-slate-50 text-slate-800 text-sm rounded-xl border border-slate-200 focus:bg-white focus:border-blue-500 focus:outline-none">
                </div>
            </div>

            <button type="submit" 
                    class="w-full py-3 px-4 bg-blue-600 hover:bg-blue-700 text-white font-bold text-sm rounded-xl shadow-md shadow-blue-500/30 transition-all hover:-translate-y-0.5 mt-2">
                Complete Registration
            </button>
        </form>

        <div class="text-center text-xs text-slate-500">
            Already have an account? 
            <a href="{{ url_for('auth.login') }}" class="font-bold text-blue-600 hover:underline">Sign In</a>
        </div>

    </div>
</div>
{% endblock %}
