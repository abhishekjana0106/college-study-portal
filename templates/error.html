{% extends 'base.html' %}

{% block title %}Error {{ error_code }} | Academix Portal{% endblock %}

{% block content %}
<div class="min-h-[70vh] flex items-center justify-center py-12 px-4 text-center">
    <div class="max-w-md w-full bg-white rounded-3xl p-8 sm:p-10 border border-slate-200 shadow-xl space-y-4">
        <div class="w-16 h-16 rounded-2xl bg-rose-50 text-rose-600 flex items-center justify-center text-2xl mx-auto">
            <i class="fas fa-triangle-exclamation"></i>
        </div>
        <div class="text-4xl font-extrabold text-slate-900 font-mono">{{ error_code }}</div>
        <h2 class="text-lg font-bold text-slate-800">Something went wrong</h2>
        <p class="text-xs text-slate-500 leading-relaxed">
            {{ message or "We couldn't find the academic page or study resource you were looking for." }}
        </p>
        <div class="pt-4 flex items-center justify-center space-x-3">
            <a href="{{ url_for('main.index') }}" class="px-5 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs rounded-xl shadow-md transition-colors">
                Back to Home
            </a>
            <a href="{{ url_for('main.browse') }}" class="px-5 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs rounded-xl transition-colors">
                Browse Repository
            </a>
        </div>
    </div>
</div>
{% endblock %}
